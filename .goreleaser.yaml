# Release builds and the Homebrew tap. Runs from .github/workflows/release.yml on a v* tag.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tonychan
    binary: tonychan
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# `brew install yukccy/tap/tonychan`. Pushes to github.com/yukccy/homebrew-tap over SSH with a
# write deploy key on that repo only; the workflow's own GITHUB_TOKEN can't reach it.
homebrew_casks:
  - name: tonychan
    binaries: [tonychan]
    repository:
      owner: yukccy
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:yukccy/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    homepage: https://yukccy.com
    description: Tony Chan's site, yukccy.com, in a terminal
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binaries are not notarised, so macOS would quarantine them on first run.
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tonychan"]
